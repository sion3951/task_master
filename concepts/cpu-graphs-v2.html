<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet CPU graphs</title>
<style>
body{margin:0;background:transparent;font-family:system-ui,sans-serif}
#quiet-cpu{--text:#e8e8e8;--muted:#949494;--purple:#b387fa;--power:#d5b487;--freq:#84bfc8;color:var(--text);font-size:13px;line-height:1.45}
#quiet-cpu *{box-sizing:border-box}#quiet-cpu .screen{background:#000;padding:22px;border-radius:4px}#quiet-cpu header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px}#quiet-cpu h2{font-size:17px;font-weight:500;margin:0}#quiet-cpu .topology{font-size:11px;color:var(--muted)}#quiet-cpu .heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px}#quiet-cpu .big{font-size:30px;font-variant-numeric:tabular-nums;font-weight:400;letter-spacing:-.03em}#quiet-cpu .muted{color:var(--muted);font-size:11px}#quiet-cpu .summary{font-size:12px;color:var(--muted)}#quiet-cpu svg{display:block;width:100%;overflow:visible}#quiet-cpu .total-row{display:grid;grid-template-columns:42px minmax(0,1fr) 66px;gap:12px}#quiet-cpu .total-row svg{grid-column:2}#quiet-cpu svg text{fill:var(--muted);font-family:inherit;font-size:10px}#quiet-cpu .metric{display:grid;grid-template-columns:42px minmax(0,1fr) 66px;gap:12px;align-items:center;margin-top:5px}#quiet-cpu .metric-label{color:var(--muted);font-size:11px}#quiet-cpu .metric-value{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}#quiet-cpu .axis{display:flex;justify-content:space-between;margin:3px 78px 0 54px;color:var(--muted);font-size:10px}#quiet-cpu .core-header{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin:24px 0 9px}#quiet-cpu .core{display:grid;grid-template-columns:42px minmax(0,1fr) 66px;align-items:center;width:100%;gap:12px;background:transparent;border:0;border-radius:2px;color:var(--text);font:inherit;font-size:11px;padding:4px 0;text-align:left;cursor:pointer}#quiet-cpu .core[aria-pressed=true]{background:#121212}#quiet-cpu .core .now{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;visibility:hidden}#quiet-cpu .core:hover .now,#quiet-cpu .core:focus-visible .now,#quiet-cpu .core[aria-pressed=true] .now{visibility:visible}#quiet-cpu .details{font-size:11px;color:var(--muted);margin:15px 0 0;font-variant-numeric:tabular-nums;min-height:17px}#quiet-cpu .example{font-size:11px;color:var(--muted);margin:11px 0 0}#quiet-cpu .outside{color:var(--foreground,#949494);opacity:.65;font-size:11px;margin-top:8px}
@media(max-width:420px){#quiet-cpu .screen{padding:16px}#quiet-cpu .topology{max-width:155px;text-align:right}#quiet-cpu .summary{font-size:11px}#quiet-cpu .metric,#quiet-cpu .total-row{gap:8px}#quiet-cpu .core{gap:8px}#quiet-cpu .axis{margin-left:50px;margin-right:74px}}
#quiet-cpu [hidden]{display:none!important}#quiet-cpu .toggles{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid #1b1b1b;margin-top:18px;padding-top:8px}#quiet-cpu .toggles button{font:inherit;font-size:11px;color:var(--muted);background:none;border:0;border-radius:0;padding:7px 0;cursor:pointer;display:flex;gap:6px;align-items:center}#quiet-cpu .toggles button::before{content:'';width:5px;height:5px;border:1px solid #666;border-radius:50%}#quiet-cpu .toggles button[aria-pressed=true]{color:var(--text)}#quiet-cpu .toggles button[aria-pressed=true]::before{background:var(--text);border-color:var(--text)}
</style></head><body>
<div id="quiet-cpu"><section class="screen" aria-label="task_master simplified CPU concept">
<header><h2>CPU</h2><span class="topology">9800X3D · 8 cores / 16 threads</span></header>
<div class="heading"><span class="big">100<span style="font-size:17px">%</span></span><span class="summary">8 / 8 physical cores busy</span></div>
<div class="total-row"><svg id="total" height="112" role="img" aria-label="Total physical core busy time over sixty seconds, currently one hundred percent"></svg></div>
<div class="metric" id="power-panel" hidden><span class="metric-label">Power</span><svg id="power" height="28" role="img" aria-label="CPU package power over sixty seconds, currently ninety one watts"></svg><span class="metric-value">91 W</span></div>
<div class="metric" id="freq-panel" hidden><span class="metric-label">Freq</span><svg id="freq" height="28" role="img" aria-label="Active mean CPU frequency over sixty seconds, currently five point one gigahertz"></svg><span class="metric-value">5.1 GHz</span></div>
<div class="metric" id="threads-panel" hidden><span class="metric-label">Threads</span><svg id="threads" height="28" role="img" aria-label="Logical thread mean busy time over sixty seconds, currently fifty percent"></svg><span class="metric-value">50%</span></div>
<div class="axis"><span>−60 s</span><span>Now</span></div>
<div class="core-header"><span>Physical cores</span><span>Busy time · 0–100%</span></div>
<div id="cores" aria-label="Select a physical core to see sibling activity"></div>
<div id="details" class="details" aria-live="polite"></div>
<div class="example" id="smt-note" hidden>8 busy threads, 8 idle siblings — all 8 physical cores occupied.</div>
<div class="toggles" aria-label="Additional CPU metrics"><button type="button" data-metric="power" aria-pressed="false" aria-controls="power-panel">Power</button><button type="button" data-metric="freq" aria-pressed="false" aria-controls="freq-panel">Frequency</button><button type="button" data-metric="threads" aria-pressed="false" aria-controls="threads-panel smt-note">Threads</button></div>
</section><div class="outside">Concept · illustrative data. Core busy time measures occupancy, not throughput.</div></div>
<script>
(() => {
 const root=document.getElementById('quiet-cpu'),NS='http://www.w3.org/2000/svg',visible={power:false,freq:false,threads:false};let selected=0;
 const $=id=>root.querySelector('#'+id),clamp=x=>Math.max(0,Math.min(100,x));
 const data=Array.from({length:61},(_,t)=>{const cores=Array.from({length:8},(_,c)=>{let v=t<13?8+t*2.3:t<31?38+(t-13)*3.0:t<45?92+5*Math.sin((t-31)*.4+c*.5):100;return clamp(v+(t>=45?0:Math.sin(t*.14+c)*4))});let busy=cores.reduce((s,c)=>s+c,0)/8;return{cores,busy,power:21+.7*busy,freq:4.5+.006*busy}});
 function add(svg,name,a){const e=document.createElementNS(NS,name);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));svg.appendChild(e);return e}
 function plot(svg,values,h,max,color,filled=false,axis=false){const w=Math.max(20,svg.getBoundingClientRect().width),left=1,top=3,bottom=h-4,span=w-left-2;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();const points=values.map((v,i)=>[left+span*i/60,bottom-(bottom-top)*v/max]);let d=points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)).join(' ');if(axis){[0,100].forEach(v=>{const y=bottom-(bottom-top)*v/max;add(svg,'line',{x1:left,x2:w,y1:y,y2:y,stroke:'#1b1b1b'});const text=add(svg,'text',{x:left-5,y:y+3,'text-anchor':'end'});text.textContent=v})}if(filled)add(svg,'path',{d:d+`L${w-2},${bottom}L${left},${bottom}Z`,fill:color,opacity:.06});add(svg,'path',{d,fill:'none',stroke:color,'stroke-width':1.5,'stroke-linejoin':'round'})}
 function draw(){plot($('total'),data.map(d=>d.busy),112,100,'#b387fa',true,true);if(visible.power)plot($('power'),data.map(d=>d.power),28,140,'#d5b487');if(visible.freq)plot($('freq'),data.map(d=>d.freq),28,6,'#84bfc8');if(visible.threads)plot($('threads'),data.map(d=>d.busy/2),28,100,'#999');root.querySelectorAll('.spark').forEach((svg,c)=>{plot(svg,data.map(d=>d.cores[c]),28,100,'#b387fa');if(visible.threads){const w=svg.getBoundingClientRect().width;add(svg,'line',{x1:1,x2:w-2,y1:24,y2:24,stroke:'#666','stroke-width':1,'stroke-dasharray':'2 4'})}})}
 function select(c){selected=c;root.querySelectorAll('.core').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===c)));let parts=[`Core ${c}`,`100% busy`];if(visible.threads)parts.push(`CPU ${c}: 100% / CPU ${c+8}: 0%`);if(visible.freq)parts.push(`${(5.10+Math.sin(c)*.04).toFixed(1)} GHz`);$('details').textContent=parts.join(' · ')}
 root.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{const metric=b.dataset.metric;visible[metric]=!visible[metric];b.setAttribute('aria-pressed',String(visible[metric]));$(metric+'-panel').hidden=!visible[metric];if(metric==='threads')$('smt-note').hidden=!visible.threads;select(selected);draw()}));
 for(let c=0;c<8;c++){const b=document.createElement('button');b.type='button';b.className='core';b.setAttribute('aria-label',`Core ${c}, one hundred percent busy. Select to inspect sibling threads.`);b.innerHTML=`<span>Core ${c}</span><svg class="spark" height="28" aria-hidden="true"></svg><span class="now">100%</span>`;b.addEventListener('click',()=>select(c));$('cores').appendChild(b)}select(selected);draw();new ResizeObserver(draw).observe(root.querySelector('.screen'));
})();
</script></body></html>
